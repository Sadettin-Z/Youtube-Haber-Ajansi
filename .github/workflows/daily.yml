name: Youtube Haber Ajansı
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = normal çalışma; scrape = sadece transkriptleri indir ve manual/icerikler.json olarak repoya yaz (Gemini yok)'
        type: choice
        options: [full, scrape]
        default: scrape
      channel:
        description: 'Sadece bu kanal (main.py CHANNELS adı, ör. Erdem Atay); boş = hepsi'
        type: string
        default: ''
      lookback_hours:
        description: 'Kaç saat geriye bakılsın'
        type: string
        default: '24'
      latest_only:
        description: 'Kanal başına yalnızca en yeni video'
        type: boolean
        default: false
jobs:
  run_report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests google-genai isodate beautifulsoup4 reportlab
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Raporu Calistir
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          PIPELINE_MODE: ${{ inputs.mode || 'full' }}
          CHANNEL_FILTER: ${{ inputs.channel }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '24' }}
          LATEST_ONLY: ${{ inputs.latest_only }}
        run: python main.py
      - name: Transkriptleri repoya kaydet
        if: ${{ inputs.mode == 'scrape' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual/icerikler.json
          git commit -m "Transkriptler $(date -u +%Y-%m-%dT%H:%MZ) (mode=scrape run ${{ github.run_number }})" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
