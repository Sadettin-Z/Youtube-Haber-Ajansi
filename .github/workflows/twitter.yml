name: Twitter Haber Ajansı
on:
  schedule:
    # Her gün 08:30 İstanbul (05:30 UTC): son 24 saat
    - cron: '30 5 * * *'
    # Pazartesi 09:30 İstanbul (06:30 UTC): haftalık özet (son 7 gün)
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = rapor üret ve Discord''a gönder; scrape = sadece tweetleri indir (Gemini yok); probe = aday Apify aktörlerini küçük girdiyle sına, ham örnekleri twitter/probe/ altına yaz'
        type: choice
        options: [full, scrape, probe]
        default: full
      hours:
        description: 'Kaç saat geriye bakılsın (24 = günlük, 168 = haftalık)'
        type: string
        default: '24'
      refresh_followings:
        description: 'Takip listesini önbelleğe bakmadan yeniden çek'
        type: boolean
        default: false
concurrency:
  group: twitter-haber-ajansi
  cancel-in-progress: false
jobs:
  run_report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests google-genai
      - name: Pencereyi belirle
        id: win
        run: |
          if [ -n "${{ inputs.hours }}" ]; then
            echo "hours=${{ inputs.hours }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 6 * * 1" ]; then
            echo "hours=168" >> "$GITHUB_OUTPUT"
          else
            echo "hours=24" >> "$GITHUB_OUTPUT"
          fi
      - name: Raporu Calistir
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.TWITTER_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ vars.DISCORD_MENTION_USER_ID }}
          X_HANDLE: ${{ vars.X_HANDLE || 'SadettinZ_' }}
          WINDOW_HOURS: ${{ steps.win.outputs.hours }}
          REFRESH_FOLLOWINGS: ${{ inputs.refresh_followings == true && '1' || '0' }}
          PIPELINE_MODE: ${{ inputs.mode || 'full' }}
        run: python twitter_main.py
      - name: Rapor ve önbelleği repoya kaydet
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twitter/followings.json twitter/tweets.json twitter/state.json twitter/reports twitter/probe 2>/dev/null || true
          git commit -m "Twitter: $(date -u +%Y-%m-%dT%H:%MZ) (mode=${{ inputs.mode || 'full' }}, hours=${{ steps.win.outputs.hours }}, run ${{ github.run_number }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
